name: Tower Android Build & Release

on:
  push:
    branches:
      - Android
    tags:
      - "android-v*"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core unit tests
        working-directory: android
        run: ./gradlew :core:test --no-daemon

      - name: Decode release keystore (if configured)
        if: ${{ secrets.TOWER_KEYSTORE_BASE64 != '' }}
        env:
          TOWER_KEYSTORE_BASE64: ${{ secrets.TOWER_KEYSTORE_BASE64 }}
        run: |
          echo "$TOWER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tower-release.jks"
          echo "TOWER_KEYSTORE_PATH=$RUNNER_TEMP/tower-release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        env:
          TOWER_KEYSTORE_PASSWORD: ${{ secrets.TOWER_KEYSTORE_PASSWORD }}
          TOWER_KEY_ALIAS: ${{ secrets.TOWER_KEY_ALIAS }}
          TOWER_KEY_PASSWORD: ${{ secrets.TOWER_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          cp "$APK_SRC" "dist/Tower-1.0.34-85-android.apk"
          (cd dist && sha256sum "Tower-1.0.34-85-android.apk" > "Tower-1.0.34-85-android.apk.sha256")

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tower-android-apk
          path: dist/*
